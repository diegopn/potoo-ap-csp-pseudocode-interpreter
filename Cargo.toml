[package]
name = "potoo-ap-csp-pseudocode-interpreter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/diegopn/potoo-ap-csp-pseudocode-interpreter"
homepage = "https://diegopn.github.io/potoo-site/manual/ap-csp-pseudocode/"
readme = "README.md"
description = "A Rust interpreter for the AP CSP assessment pseudocode notation."

[lib]
name = "potoo_ap_csp_pseudocode_interpreter"
path = "src/lib.rs"

[[bin]]
name = "potoo-ap-csp"
path = "src/bin/potoo-ap-csp.rs"
